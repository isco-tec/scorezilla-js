name: SDK Release

# Handles BOTH halves of the Changesets release flow:
#
#   1. When unmerged changesets exist on `main` — opens (or updates) a
#      "Version Packages" PR that bumps `package.json`, updates
#      `CHANGELOG.md`, and consumes the changeset files.
#
#   2. When that Version PR is merged (no unmerged changesets remain) —
#      publishes the new version to npm with `--provenance`, creates a
#      GitHub release, and appends SRI hashes to the release body so
#      consumers can copy them into their `<script integrity="…">` tags.
#
# `changesets/action` detects which case applies and does the right thing.
#
# Prerequisites — must exist as repo secrets before the workflow's
# publish branch can run:
#   • NPM_TOKEN — npm Automation token (bypasses 2FA for CI publishes)
#                  with write access to the `scorezilla` package
#   • GITHUB_TOKEN — automatically provided by GH Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

# A release is atomic-ish — don't let two runs race. We DO NOT cancel an
# in-flight run; a half-completed release is worse than a queued one.
concurrency:
  group: sdk-release
  cancel-in-progress: false

permissions:
  # Needed for: creating the GitHub release, pushing the Version PR.
  contents: write
  # Needed for: opening/updating the Version PR.
  pull-requests: write
  # Needed for: OIDC token used by `npm publish --provenance` to sign the
  # tarball with a verifiable build-origin attestation.
  id-token: write

env:
  PNPM_VERSION: '10.11.0'
  # Enable provenance attestations — this repo is PUBLIC, so npm can
  # verify the build origin against the sigstore bundle.
  NPM_PUBLISH_WITH_PROVENANCE: '1'

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `npm-publish` is a GitHub Environment with required reviewers.
    # Every run of this job pauses for manual approval before any step
    # executes — including the version-PR-opening branch, not just the
    # actual `npm publish`. The cost: one click per main-push. The
    # payoff: even a malicious workflow modification can't quietly
    # publish a tarball; you have to physically approve each run.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/scorezilla
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Changesets needs full history to compute the changelog diff
          # across versions. Fetch-depth 0 = full clone.
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          # Configures ~/.npmrc to authenticate against npm via NODE_AUTH_TOKEN.
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ─── Hard gates — run BEFORE handing control to changesets/action.
      # The publish branch of that action calls `npm publish` directly;
      # any failure after that point ships a half-broken package. These
      # checks duplicate sdk-ci.yml's PR gates intentionally — main can
      # always merge a path the PR didn't exercise.
      - name: Build SDK
        run: pnpm build

      - name: Unit tests
        run: pnpm test:unit

      - name: Types-resolution gate (attw)
        run: pnpm check:types-resolution

      - name: Bundle-size gate
        run: pnpm size

      # ─── Last-minute supply-chain audit before handing control to the
      # release step. Duplicates sdk-ci.yml's `supply-chain` job by design:
      # a CVE published between PR merge and release push (or a devDep
      # update in main between runs) won't have been caught by the PR gate.
      - name: pnpm audit (production tree)
        run: pnpm audit --prod --audit-level=high

      # ─── The actual release step.
      #
      # `version:` script runs when there ARE unmerged changesets — Changesets
      # bumps package.json + CHANGELOG.md and opens/updates the PR.
      # `publish:` script runs when there are NO unmerged changesets and the
      # tree's version is ahead of what's on npm — publishes to the registry.
      # The action wires `NODE_AUTH_TOKEN` automatically from NPM_TOKEN.
      - name: Changesets — version PR or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset:version
          # publish.sh routes to the right dist-tag based on the version
          # string (stable → `latest`, `-next.N` → `next`, etc.) and adds
          # `--provenance` when NPM_PUBLISH_WITH_PROVENANCE=1 (set above).
          publish: bash scripts/publish.sh
          title: 'chore(release): version scorezilla'
          commit: 'chore(release): version scorezilla'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ─── SRI hash generation.
      #
      # Gated on `scripts/publish.sh`'s own `$GITHUB_OUTPUT` signals
      # (`published_name` + `published_version`) rather than
      # `steps.changesets.outputs.published`/`publishedPackages`. The
      # action's stdout-parsing empirically reports `publishedPackages:
      # []` for our publishes (scorezilla-js#20); owning the signal
      # end-to-end means downstream steps never silently no-op.
      - name: Generate SRI block
        if: steps.changesets.outputs.published_name != '' && steps.changesets.outputs.published_version != ''
        id: sri
        run: |
          set -euo pipefail
          dist=dist
          out=/tmp/release-sri.md
          {
            echo "## Subresource Integrity (SRI)"
            echo ""
            echo "If loading this release from a CDN, pin both the version AND the SRI hash so a future tarball can't quietly change what runs in your page:"
            echo ""
            echo '| File | SHA-384 hash |'
            echo '| --- | --- |'
            for name in index.js index.cjs; do
              file="$dist/$name"
              if [ -f "$file" ]; then
                hash="sha384-$(openssl dgst -sha384 -binary "$file" | openssl base64 -A)"
                echo "| \`dist/$name\` | \`$hash\` |"
              fi
            done
            echo ""
            echo "Example (ESM):"
            echo ""
            echo '```html'
            echo "<script"
            echo '  type="module"'
            echo "  src=\"https://cdn.jsdelivr.net/npm/scorezilla@VERSION/dist/index.js\""
            echo '  integrity="<paste the dist/index.js hash from above>"'
            echo '  crossorigin="anonymous"></script>'
            echo '```'
          } > "$out"
          echo "Generated SRI block:"
          echo "----"
          cat "$out"
          echo "----"

      - name: Append SRI hashes to GitHub release
        # Two gates: changesets/action says "I published" AND our own
        # publish.sh wrote the package name+version to $GITHUB_OUTPUT.
        # The action's `publishedPackages` array empirically comes back
        # `[]` even when a publish succeeded (scorezilla-js#20) because
        # the stdout-parsing relies on changesets/action's own
        # JSON-emission path which our publish.sh doesn't trigger.
        # Owning the signal end-to-end means downstream steps never
        # silently no-op.
        if: steps.changesets.outputs.published_name != '' && steps.changesets.outputs.published_version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Env-pass-through rather than ${{ }} interpolation — same
          # injection-defense reasoning as before (CWE-77). Even though
          # publish.sh sets these, treat them as untrusted from the
          # workflow's perspective.
          PUBLISHED_NAME: ${{ steps.changesets.outputs.published_name }}
          PUBLISHED_VERSION: ${{ steps.changesets.outputs.published_version }}
        run: |
          set -euo pipefail
          tag="${PUBLISHED_NAME}@${PUBLISHED_VERSION}"
          sri_block=$(cat /tmp/release-sri.md)
          echo "Annotating GitHub release $tag with SRI hashes…"
          # `changesets/action` opens the release as part of its publish
          # branch. If it didn't (rare — typically a misconfig), create
          # one ourselves so the SRI block has a home.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "  → release $tag doesn't exist yet, creating it"
            gh release create "$tag" --title "$tag" --prerelease --notes ""
          fi
          current=$(gh release view "$tag" --json body --jq '.body' 2>/dev/null || echo "")
          new_body=$(printf '%s\n\n%s\n' "$current" "$sri_block")
          gh release edit "$tag" --notes "$new_body"
          echo "  → done"

      # ─── Smoke-confirm the new tarball is installable.
      - name: Post-publish smoke test
        if: steps.changesets.outputs.published_name != '' && steps.changesets.outputs.published_version != ''
        env:
          # Same env-pass-through pattern as above.
          PUBLISHED_NAME: ${{ steps.changesets.outputs.published_name }}
          PUBLISHED_VERSION: ${{ steps.changesets.outputs.published_version }}
        run: |
          set -euo pipefail
          name="$PUBLISHED_NAME"
          version="$PUBLISHED_VERSION"
          echo "Waiting for ${name}@${version} to appear on registry…"
          for i in $(seq 1 30); do
            if npm view "${name}@${version}" version > /dev/null 2>&1; then
              echo "  → visible after ${i} attempt(s)"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "  → did NOT appear within 30 attempts (~5 min); failing."
              exit 1
            fi
            sleep 10
          done
          tmp=$(mktemp -d)
          cd "$tmp"
          npm init -y > /dev/null
          npm install "${name}@${version}" --no-audit --no-fund > /dev/null
          # Pass name + version as argv to a heredoc-launched node, so
          # they never reach the JS source via shell substitution.
          EXPECT_NAME="$name" EXPECT_VERSION="$version" node --input-type=module -e "
            const name = process.env.EXPECT_NAME;
            const version = process.env.EXPECT_VERSION;
            const p = await import(name);
            if (!p.Scorezilla) throw new Error(name + ': Scorezilla export missing');
            if (!p.SDK_VERSION || p.SDK_VERSION !== version) {
              throw new Error(name + ': SDK_VERSION mismatch — expected ' + version + ', got ' + p.SDK_VERSION);
            }
          "
          echo "  → ${name}@${version} installs cleanly and exports the expected surface"
          cd - > /dev/null
          rm -rf "$tmp"

      # ─── Notify the scorezilla repo of the new release so its marketing
      # ─── SSoT (apps/marketing/src/data/sdk.ts) auto-syncs. The receiver
      # ─── opens an auto-PR with the version + dist-tag bump.
      # ─── Receiver workflow:
      # ─── isco-tec/scorezilla/.github/workflows/sdk-version-sync.yml
      # ─── Setup:
      # ─── isco-tec/scorezilla/blob/main/docs/cross-repo-sdk-sync.md
      - name: Notify scorezilla repo of new release
        if: steps.changesets.outputs.published_name == 'scorezilla' && steps.changesets.outputs.published_version != ''
        env:
          PUBLISHED_VERSION: ${{ steps.changesets.outputs.published_version }}
          GH_TOKEN: ${{ secrets.SCOREZILLA_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::SCOREZILLA_REPO_DISPATCH_TOKEN not set; skipping marketing auto-sync."
            echo "  → T4 of the version-drift guardrail is a no-op until the secret is added."
            echo "  → Setup steps: https://github.com/isco-tec/scorezilla/blob/main/docs/cross-repo-sdk-sync.md"
            exit 0
          fi
          # Detect dist-tag from the version string. Prereleases (anything
          # with a `-suffix`) ship on `next`; stable releases on `latest`.
          distTag="latest"
          if [[ "$PUBLISHED_VERSION" == *"-"* ]]; then
            distTag="next"
          fi
          releaseUrl="https://github.com/isco-tec/scorezilla-js/releases/tag/scorezilla@$PUBLISHED_VERSION"
          gh api repos/isco-tec/scorezilla/dispatches \
            -f event_type=sdk-published \
            -f "client_payload[version]=$PUBLISHED_VERSION" \
            -f "client_payload[distTag]=$distTag" \
            -f "client_payload[releaseUrl]=$releaseUrl"
          echo "  → dispatched sdk-published event to isco-tec/scorezilla"
          echo "  → receiver opens auto-PR within ~30s; merge to deploy"
