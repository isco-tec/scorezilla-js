version: 2

# Dependabot keeps two attack surfaces current:
#   1. npm devDependencies — anything in the build/test toolchain that gets
#      a published CVE.
#   2. GitHub Actions — the action versions referenced in
#      .github/workflows/*. Pinning to mutable tags (`@v4`) means a tag
#      force-move to a malicious commit is invisible without Dependabot
#      digest updates.
#
# Security updates (separate from these schedules) fire immediately on
# advisory publication when `dependabot_security_updates` is enabled at
# the repo level — verify in Settings → Code security.

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Group patch + minor bumps into a single PR per month. Majors stay
    # individual so they can be reviewed on their own merits.
    groups:
      dev-dependencies-non-major:
        dependency-type: development
        update-types:
          - patch
          - minor
    ignore:
      # Majors whose current release requires Node >= 22 — incompatible with
      # the Node 20 leg of the unit-test matrix (and `engines.node >=20`).
      # Re-enable when Node 20 support is dropped. Vitest 5 needs ^22.12;
      # jsdom 30 needs ^22.22 (its undici 8 fails to start on Node 20).
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
      - dependency-name: jsdom
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
